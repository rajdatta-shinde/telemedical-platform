name: Keep backend awake

# Render's free tier sleeps the service after ~15 min idle, causing a slow,
# error-prone cold start on the next request. This pings the health endpoint
# every 14 minutes so the instance stays warm.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging backend at $(date -u)"
          curl -fsS --max-time 90 https://telemedical-backend.onrender.com/health || echo "ping failed (non-fatal)"
